[project]
name = "resumeforge"
version = "0.1.0"
description = "ResumeForge AI — AI-powered resume tailoring using local and free-tier LLMs"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
    "notion-client>=2.0.0",
    "email-validator>=2.3.0",
    "google-api-python-client>=2.183.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "gspread>=6.2.1",
    "jinja2>=3.1.6",
    "pydantic>=2.11.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.1.1",
    "streamlit>=1.58.0",
]

[project.scripts]
resumeforge = "resumeforge.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
